caption=Перемещение диапазона ячеек — Запись
lbl_step1=1. Запустите запись макроса: вкладка Разработчик → Запись макроса.
lbl_step1b=   Укажите «Сохранить макрос в: Эта книга», затем нажмите ОК.
lbl_step2=2. Переместите ячейки только с помощью Вырезать и Вставить (без перетаскивания).
lbl_step3=3. Остановите запись: вкладка Разработчик → Остановить запись.
lbl_step4=4. Нажмите «Стоп» ниже.
lbl_reminder=⚠ Не используйте перетаскивание. Используйте Вырезать (Ctrl+X), затем Вставить (Ctrl+V или Enter).
