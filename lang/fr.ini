[frmMoveWait]
caption=Déplacer une plage de cellules – Enregistrement
lbl_step1=1. Démarrez l'enregistrement de macro : onglet Développeur → Enregistrer une macro.
lbl_step1b=   Définissez « Enregistrer la macro dans : Ce classeur », puis cliquez sur OK.
lbl_step2=2. Déplacez les cellules uniquement par Couper & Coller (ne pas glisser-déposer).
lbl_step3=3. Arrêtez l'enregistrement : onglet Développeur → Arrêter l'enregistrement.
lbl_step4=4. Cliquez sur Arrêter ci-dessous.
